  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const C = { x: 540, y: 800 };

      // ---- 0.0: the drop. The shrunken clock of s1 becomes the n8n mark.
      tl.fromTo("#v2-hub", { scale: 0.12 }, { scale: 1, duration: 0.7, ease: "back.out(1.5)" }, 0);
      tl.fromTo("#v2-hub img", { rotation: -90, scale: 0.6 }, { rotation: 0, scale: 1, duration: 0.8, ease: "expo.out" }, 0.02);
      tl.fromTo("#v2-light", { scale: 0.7, opacity: 0.4 }, { scale: 1, opacity: 1, duration: 1.2, ease: "expo.out" }, 0);
      tl.fromTo("#v2-word span", { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power2.out" }, 0.3);

      // the apps burst back out of the centre onto a ring
      const tiles = ["#v2-t-gmail", "#v2-t-cal", "#v2-t-wa", "#v2-t-tg", "#v2-t-drive", "#v2-t-sheets"];
      const pos = [
        [211, 650],
        [540, 500],
        [869, 650],
        [869, 950],
        [540, 1100],
        [211, 950],
      ];
      tiles.forEach((t, i) => {
        tl.fromTo(
          t,
          { x: C.x - pos[i][0], y: C.y - pos[i][1], scale: 0.2, opacity: 0 },
          { x: 0, y: 0, scale: 1, opacity: 1, duration: 0.75, ease: "expo.out" },
          0.12 + i * 0.05
        );
      });

      // ---- "vos applications se parlent" (1.2): wires draw, data travels both ways
      const wires = ["#v2-w1", "#v2-w2", "#v2-w3", "#v2-w4", "#v2-w5", "#v2-w6"];
      wires.forEach((w, i) => {
        const len = document.querySelector(w).getTotalLength() || 600;
        tl.fromTo(w, { strokeDasharray: len, strokeDashoffset: len }, { strokeDashoffset: 0, duration: 0.5, ease: "power2.inOut" }, 1.15 + i * 0.07);
      });
      tl.to("#v2-word span", { opacity: 0, filter: "blur(8px)", duration: 0.16, ease: "power2.in" }, 1.08);
      tl.fromTo("#v2-title span", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.16, stagger: 0.08, ease: "power2.out" }, 1.25);
      const dots = ["#v2-d1", "#v2-d2", "#v2-d3", "#v2-d4", "#v2-d5", "#v2-d6"];
      dots.forEach((d, i) => {
        const inward = i % 2 === 0;
        tl.set(d, { opacity: 0 }, 0);
        tl.fromTo(
          d,
          { opacity: 1, motionPath: { path: wires[i], align: wires[i], start: inward ? 0 : 1, end: inward ? 0 : 1 } },
          { motionPath: { path: wires[i], align: wires[i], start: inward ? 0 : 1, end: inward ? 1 : 0 }, duration: 0.7, ease: "power1.inOut" },
          1.55 + i * 0.1
        );
        tl.to(d, { opacity: 0, duration: 0.1 }, 1.55 + i * 0.1 + 0.7);
      });
      tl.fromTo("#v2-hub", { boxShadow: "0 30px 70px rgba(11,42,69,0.2), 0 0 0 0 rgba(10,164,188,0)" }, { boxShadow: "0 30px 70px rgba(11,42,69,0.2), 0 0 0 16px rgba(10,164,188,0.25)", duration: 0.25, yoyo: true, repeat: 3, ease: "power1.inOut" }, 1.9);

      // ---- "et vos tâches s'enchaînent automatiquement" (2.6): the ring straightens into a chain
      tl.to("#v2-ring-wires", { opacity: 0, duration: 0.25, ease: "power2.in" }, 2.55);
      tl.to(["#v2-t-cal", "#v2-t-tg", "#v2-t-drive"], { opacity: 0, scale: 0.5, filter: "blur(8px)", duration: 0.35, ease: "power3.in" }, 2.6);
      tl.to("#v2-t-gmail", { x: 165 - 211, y: 800 - 650, duration: 0.6, ease: "power3.inOut" }, 2.62);
      tl.to("#v2-hub", { x: 415 - 540, y: 0, scale: 0.7, duration: 0.6, ease: "power3.inOut" }, 2.62);
      tl.to("#v2-t-sheets", { x: 665 - 211, y: 800 - 950, duration: 0.6, ease: "power3.inOut" }, 2.66);
      tl.to("#v2-t-wa", { x: 915 - 869, y: 800 - 650, duration: 0.6, ease: "power3.inOut" }, 2.7);
      ["#v2-c1", "#v2-c2", "#v2-c3"].forEach((w, i) => {
        const len = document.querySelector(w).getTotalLength() || 250;
        tl.fromTo(w, { strokeDasharray: len, strokeDashoffset: len }, { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, 3.2 + i * 0.12);
      });
      ["#v2-e1", "#v2-e2", "#v2-e3"].forEach((d, i) => {
        const w = ["#v2-c1", "#v2-c2", "#v2-c3"][i];
        tl.set(d, { opacity: 0 }, 0);
        tl.fromTo(d, { opacity: 1, motionPath: { path: w, align: w, start: 0, end: 0 } }, { motionPath: { path: w, align: w, start: 0, end: 1 }, duration: 0.32, ease: "none" }, 3.4 + i * 0.3);
        tl.to(d, { opacity: 0, duration: 0.06 }, 3.72 + i * 0.3);
      });

      // ---- dive (3.9): the camera falls into the Gmail node, which becomes the n8n canvas
      tl.to("#v2-title span", { opacity: 0, filter: "blur(8px)", duration: 0.18, stagger: 0.03, ease: "power2.in" }, 3.75);
      tl.fromTo("#v2-cam", { scale: 1, x: 0, y: 0 }, { scale: 22, x: 375, y: 160, duration: 0.7, ease: "power3.in" }, 3.9);
      // at the fastest frame the node switches to n8n's canvas, and the whole frame follows
      tl.to("#v2-chain-wires", { opacity: 0, duration: 0.15 }, 4.1);
      tl.set("#v2-gmail-dark", { opacity: 1 }, 4.3);
      tl.set("#v2-t-gmail img", { opacity: 0 }, 4.3);
      tl.to("#v2-night", { opacity: 1, duration: 0.2, ease: "power2.in" }, 4.36);
      tl.to("#v2-light", { opacity: 0, duration: 0.3 }, 4.2);

      window.__timelines["v2"] = tl;
    })();
  </script>
