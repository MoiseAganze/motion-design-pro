  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const $ = (s) => document.querySelector(s);
      const HUB = "190 190";

      // ---- the light and the orbit move gently the whole time (the world, not the titles)
      tl.fromTo("#v1-light-a", { x: 0, y: 0 }, { x: -40, y: 24, duration: 10, ease: "none" }, 0);
      tl.fromTo("#v1-light-b", { x: 0, y: 0 }, { x: 36, y: -20, duration: 10, ease: "none" }, 0);
      tl.fromTo("#v1-orbit", { rotation: 0 }, { rotation: 16, duration: 9.2, ease: "none" }, 0);
      tl.fromTo(".v1-tile", { rotation: 0 }, { rotation: -16, duration: 9.2, ease: "none" }, 0);

      // ---- clock: the second hand ticks on every "tic" of the score (0.5 s), until "Et si"
      tl.set("#v1-hand-s", { rotation: 0, svgOrigin: HUB }, 0);
      for (let k = 1; k <= 14; k++) {
        tl.to("#v1-hand-s", { rotation: k * 6, svgOrigin: HUB, duration: 0.12, ease: "back.out(3)" }, k * 0.5);
      }
      // hours pass: 08:00 -> 09:10 slowly, then 18:47 on "encore et encore"
      const time = { m: 480 };
      const chip = $("#v1-chip");
      const drawClock = () => {
        const m = time.m;
        const hh = Math.floor(m / 60) % 24;
        const mm = Math.floor(m % 60);
        chip.textContent = String(hh).padStart(2, "0") + ":" + String(mm).padStart(2, "0");
        gsap.set("#v1-hand-m", { rotation: (m % 60) * 6, svgOrigin: HUB });
        gsap.set("#v1-hand-h", { rotation: ((m / 60) % 12) * 30, svgOrigin: HUB });
      };
      tl.fromTo(time, { m: 480 }, { m: 550, duration: 4.2, ease: "none", onUpdate: drawClock }, 0);
      tl.to(time, { m: 1127, duration: 2.7, ease: "power2.in", onUpdate: drawClock }, 4.2);
      drawClock();

      // ---- "Répondre aux mêmes e-mails…" (0.72): badges climb, replies pile up
      const count = (id, from, to, at, dur) => {
        const o = { v: from };
        const el = $(id);
        tl.fromTo(o, { v: from }, { v: to, duration: dur, ease: "power1.in", onUpdate: () => (el.textContent = Math.round(o.v)) }, at);
        tl.fromTo(id, { scale: 1 }, { scale: 1.25, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, at);
      };
      count("#v1-b-gmail", 3, 27, 0.8, 1.4);
      const pop = (id, at, rot) =>
        tl.fromTo(id, { opacity: 0, scale: 0.82, y: 26, rotation: 0 }, { opacity: 1, scale: 1, y: 0, rotation: rot || 0, duration: 0.45, ease: "back.out(1.6)" }, at);
      pop("#v1-mail-1", 0.75, -1.5);
      pop("#v1-mail-2", 1.15, 1.2);

      // ---- "copier les mêmes données…" (2.56): the same row, pasted again and again
      tl.to(["#v1-mail-1", "#v1-mail-2"], { opacity: 0, y: -50, duration: 0.25, ease: "power3.in" }, 2.3);
      tl.fromTo("#v1-sheet", { opacity: 0, y: 40, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: "expo.out" }, 2.45);
      tl.fromTo("#v1-t-sheets", { scale: 1 }, { scale: 1.12, duration: 0.14, yoyo: true, repeat: 1, ease: "power2.out" }, 2.5);
      ["#v1-r2", "#v1-r3"].forEach((r, i) => {
        const at = 2.95 + i * 0.42;
        tl.fromTo(r, { opacity: 0, y: -52, backgroundColor: "rgba(0,120,195,0.22)" }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, at);
        tl.to(r, { backgroundColor: "rgba(0,120,195,0)", duration: 0.5, ease: "power1.out" }, at + 0.3);
      });

      // ---- "relancer, encore et encore" (4.24): reminders keep landing on the same pile
      tl.to("#v1-sheet", { opacity: 0, y: -50, duration: 0.25, ease: "power3.in" }, 4.05);
      count("#v1-b-wa", 2, 9, 4.35, 1.6);
      count("#v1-b-cal", 1, 5, 4.9, 1.3);
      const rel = [
        ["#v1-rel-1", 4.3, -2.5],
        ["#v1-rel-2", 4.75, 2],
        ["#v1-rel-3", 5.2, -1.2],
        ["#v1-rel-4", 5.65, 3],
        ["#v1-rel-5", 6.1, -3.5],
      ];
      rel.forEach(([id, at, r]) => pop(id, at, r));
      // title, second line
      tl.fromTo("#v1-l3 span", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.16, stagger: 0.08, ease: "power2.out" }, 4.35);

      // ---- "Et si tout ça…" (7.33): the clock stops, the day blurs back
      const busy = ["#v1-orbit", "#v1-sheet", "#v1-mail-1", "#v1-mail-2", ".v1-card", "#v1-rings"];
      tl.to(busy, { opacity: 0.16, filter: "blur(10px)", duration: 0.5, ease: "power2.out" }, 7.3);
      tl.to("#v1-title .v1-line span", { opacity: 0, filter: "blur(8px)", duration: 0.2, stagger: 0.03, ease: "power2.in" }, 7.25);
      tl.fromTo("#v1-q1 span", { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, stagger: 0.12, ease: "power2.out" }, 7.4);
      tl.fromTo("#v1-q2 span", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.16, stagger: 0.08, ease: "power2.out" }, 8.15);
      tl.to("#v1-chip", { backgroundColor: "#0078C3", duration: 0.3 }, 7.33);

      // ---- anticipation into the drop (10.0): the clock is pulled to the centre and shrinks to a point
      tl.to(["#v1-q"], { opacity: 0, filter: "blur(10px)", duration: 0.25, ease: "power3.in" }, 9.68);
      tl.to("#v1-chip", { opacity: 0, y: -40, duration: 0.3, ease: "power3.in" }, 9.3);
      tl.to(busy, { opacity: 0, scale: 0.6, duration: 0.6, ease: "power3.in" }, 9.3);
      tl.to("#v1-hub", { x: 0, y: 800 - 860, scale: 0.12, duration: 0.7, ease: "power3.in" }, 9.3);

      window.__timelines["v1"] = tl;
    })();
  </script>
