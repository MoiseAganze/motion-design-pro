      const ok = (id, at) => {
        tl.to(id, { borderColor: "#00C950", duration: 0.12 }, at);
        tl.fromTo(id, { scale: 1 }, { scale: 1.07, duration: 0.11, yoyo: true, repeat: 1, ease: "power2.out" }, at);
        tl.fromTo(id + " .v4-ok", { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, at + 0.04);
      };
      const flow = (wire, pkt, t0, t1) => {
        tl.set(pkt, { opacity: 0 }, 0);
        tl.fromTo(pkt, { opacity: 1, motionPath: { path: wire, start: 0, end: 0 } }, { motionPath: { path: wire, start: 0, end: 1 }, duration: t1 - t0, ease: "none" }, t0);
        tl.set(pkt, { opacity: 0 }, t1);
        tl.to(wire, { stroke: "#00C950", duration: 0.15 }, t1);
      };
      ok("#v4-n-web", 0.6);
      flow("#v4-w-code", "#v4-p-code", 0.66, 0.9);
      ok("#v4-n-code", 0.9);
      flow("#v4-w-if", "#v4-p-if", 0.96, 1.18);
      ok("#v4-n-if", 1.18);
      // the condition is true: the false branch goes quiet
      tl.to(["#v4-n-code1", "#v4-w-code1", "#v4-plus"], { opacity: 0.35, duration: 0.3 }, 1.25);

      // ---- "la base de données est interrogée" (1.27)

      tl.fromTo("#v4-rows", { opacity: 0, y: 40, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "back.out(1.6)" }, 1.58);

        tl.fromTo(r, { scaleX: 0, transformOrigin: "0 50%" }, { scaleX: 1, duration: 0.35, ease: "expo.out" }, 1.85 + i * 0.16);
      });
      tl.to("#v4-rows", { opacity: 0, y: -30, duration: 0.25, ease: "power3.in" }, 2.75);
      flow("#v4-w-code2", "#v4-p-code2", 2.35, 2.6);

      ok("#v4-n-http", 2.95);
      flow("#v4-w-out", "#v4-p-out", 3.05, 3.3);
      tl.fromTo("#v4-resp", { opacity: 0, x: -140, scale: 0.7 }, { opacity: 1, x: 0, scale: 1, duration: 0.45, ease: "expo.out" }, 3.3);
