      gsap.set("#a1-x", { left: brk.x - 22, top: brk.y - 22 });
      tl.to(flow, { attr: { stroke: "#B3463A" }, opacity: 0.75, duration: 0.25 }, 7.56);
      tl.fromTo("#a1-x", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(2)" }, 7.6);
      tl.fromTo("#a1-zero", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 7.95);
      // A exits left, a money trail leads to the first institution
      tl.to("#a1-A", { x: -1600, filter: "blur(14px)", duration: 0.6, ease: "power3.in" }, 9.2);
      tl.set("#a1-A", { opacity: 0 }, 9.85);
      // the amount travels to the top: it is what everyone has to follow
      tl.to("#a1-numl", { opacity: 0, filter: "blur(8px)", duration: 0.25 }, 9.2);
      tl.to("#a1-num", { x: -400, y: -270, scale: 0.46, duration: 0.85, ease: "power3.inOut" }, 9.3);
      tl.fromTo("#a1-trl", { attr: { y2: 196 } }, { attr: { y2: 372 }, duration: 0.9, ease: "power2.out" }, 10.05);
      tl.fromTo("#a1-trd", { scale: 0, opacity: 0, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(2)" }, 10.85);
      tl.to("#a1-num", { opacity: 0, filter: "blur(10px)", duration: 0.35 }, 17.05);

      /* ---------- B : four institutions named, then eighteen ---------- */
      const big = [0, 1, 2, 3].map((i) => $("#a1-big" + i));
      const NAMED = [11.43, 12.47, 13.23, 14.03];
      const ROWS = [[960], [790, 1130], [620, 960, 1300], [450, 790, 1130, 1470]];
      big.forEach((b, i) => tl.set(b, { x: 960, y: 540, opacity: 0 }, 0));
      NAMED.forEach((t, step) => {
        const xs = ROWS[step];
        for (let i = 0; i <= step; i++) {
          if (i === step) tl.fromTo(big[i], { x: xs[i] + 220, y: 540, opacity: 0, scale: 0.8, filter: "blur(14px)" }, { x: xs[i], opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.6, ease: "expo.out" }, t - 0.08);
          else tl.to(big[i], { x: xs[i], duration: 0.55, ease: "power3.inOut" }, t - 0.12);
        }
      });
      tl.to("#a1-trd", { opacity: 0, duration: 0.2 }, 11.4);
      tl.to("#a1-trl", { opacity: 0, duration: 0.3 }, 14.9);
      // eighteen: the four big tiles fold into the grid while fourteen others arrive
      const BIGIDX = [0, 1, 14, 5]; // CENAREF, Parquet, DGI, DGDA in the 18 list
      minis.forEach((m) => tl.set(m.el, { x: m.g[0], y: m.g[1], opacity: 0 }, 0));
      big.forEach((b, i) => {
        const m = minis[BIGIDX[i]];
        tl.to(b, { x: m.g[0], y: m.g[1], scaleX: 250 / 300, scaleY: 130 / 300, opacity: 0, duration: 0.5, ease: "power3.inOut" }, 14.95);
        tl.fromTo(m.el, { opacity: 0 }, { opacity: 1, duration: 0.2 }, 15.25);
      });
      let k = 0;
      minis.forEach((m, i) => {
        if (BIGIDX.includes(i)) return;
        tl.fromTo(m.el, { opacity: 0, scale: 0.6, filter: "blur(10px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.45, ease: "expo.out" }, 15.0 + k * 0.04);
        k++;
      });
      tl.fromTo("#a1-unicep", { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power2.out" }, 15.7);

      /* ---------- C : silos ---------- */
      tl.to("#a1-unicep", { opacity: 0, duration: 0.3 }, 17.1);
      const r = rng(11);
      minis.forEach((m, i) => {
        tl.to(m.el, { x: m.s[0], y: m.s[1], rotation: (r() - 0.5) * 7, duration: 1.1, ease: "power3.inOut" }, 17.2 + i * 0.015);
        const rect = m.el.querySelector(".wall rect");
        tl.fromTo(rect, { attr: { "stroke-dasharray": "860 860", "stroke-dashoffset": 860 } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.7, ease: "power2.inOut" }, 18.0 + i * 0.03);
      });
      // push in on two silos: CENAREF and the Parquet
      const others = minis.filter((m, i) => i !== 0 && i !== 1).map((m) => m.el);
      tl.to("#a1-world", { scale: 1.22, duration: 1.0, ease: "power2.inOut" }, 19.15);
      tl.to(others, { opacity: 0.28, duration: 0.6 }, 19.2);
      const route = $("#a1-route");
      tl.fromTo(route, { opacity: 0, attr: { "stroke-dashoffset": 120 } }, { opacity: 1, attr: { "stroke-dashoffset": 0 }, duration: 0.6, ease: "power2.out" }, 19.4);
      const RL = route.getTotalLength ? (route.getTotalLength() || 560) : 560;
      const P = (f) => (route.getPointAtLength ? route.getPointAtLength(RL * f) : { x: 690 + 540 * f, y: 560 - 60 * Math.sin(Math.PI * f) });
      // the letter crawls, then stops halfway
      const steps = 12;
      gsap.set("#a1-mail", { opacity: 0 });
      for (let s = 0; s <= steps; s++) {
        const f = 0.02 + 0.40 * (1 - Math.pow(1 - s / steps, 2));
        const p = P(f);
        if (s === 0) tl.fromTo("#a1-mail", { x: p.x, y: p.y, opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.6)" }, 19.9);
        else tl.to("#a1-mail", { x: p.x, y: p.y, duration: 1.35 / steps, ease: "none" }, 19.95 + (s - 1) * 1.35 / steps);
      }
      const stop = P(0.42);
      gsap.set("#a1-relance", { left: stop.x - 90, top: stop.y - 110 });
      tl.fromTo("#a1-relance", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.8)" }, 21.35);
      gsap.set("#a1-b1", { left: 1090, top: 330 });
      tl.fromTo("#a1-b1", { opacity: 0, y: 16, scale: 0.92 }, { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "back.out(1.5)" }, 21.75);
      gsap.set("#a1-b2", { left: 250, top: 700 });
      tl.fromTo("#a1-b2", { opacity: 0, y: 16, scale: 0.92 }, { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "back.out(1.5)" }, 22.2);
      // delays roll, a piece is lost
      gsap.set("#a1-days", { left: stop.x + 70, top: stop.y - 26 });
      tl.fromTo("#a1-days", { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out" }, 22.62);
      tl.fromTo("#a1-dval .strip", { y: 0 }, { y: -52, duration: 0.19, ease: "power2.inOut" }, 22.95);
      tl.to("#a1-dval .strip", { y: -104, duration: 0.19, ease: "power2.inOut" }, 23.15);
      tl.to("#a1-dval .strip", { y: -156, duration: 0.25, ease: "power2.inOut" }, 23.35);
      tl.fromTo("#a1-late", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2)" }, 23.45);
      gsap.set(["#a1-doc", "#a1-ghost"], { left: stop.x + 60, top: stop.y + 175 });
      gsap.set("#a1-lost", { left: stop.x - 60, top: stop.y + 300 });
      tl.fromTo("#a1-doc", { opacity: 0, y: -150, rotation: -4, scale: 0.6 }, { opacity: 1, y: 0, rotation: 9, scale: 1, duration: 0.45, ease: "power2.out" }, 23.78);
      tl.to("#a1-doc", { opacity: 0, filter: "blur(6px)", duration: 0.35, ease: "power2.in" }, 24.35);
      tl.fromTo("#a1-ghost", { opacity: 0, rotation: 9 }, { opacity: 1, duration: 0.3 }, 24.4);
      tl.fromTo("#a1-lost", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.3 }, 24.5);
      // pull back: nothing reaches the end
      tl.to("#a1-world", { scale: 1.0, duration: 0.9, ease: "power2.inOut" }, 24.95);
      tl.to("#a1-world", { opacity: 0.42, duration: 0.6 }, 25.3);
      tl.fromTo("#a1-stamp", { opacity: 0, scale: 2.3, rotation: -14 }, { opacity: 0.96, scale: 1, rotation: -7, duration: 0.17, ease: "power4.in" }, 25.75);
      tl.to("#a1-B", { x: 7, duration: 0.04, ease: "none" }, 25.92);
      tl.to("#a1-B", { x: -6, duration: 0.05, ease: "none" }, 25.96);
      tl.to("#a1-B", { x: 3, duration: 0.05, ease: "none" }, 26.01);
      tl.to("#a1-B", { x: 0, duration: 0.06, ease: "none" }, 26.06);
      // implosion into one point of gold
      tl.to("#a1-world", { scale: 0, opacity: 0, filter: "blur(16px)", duration: 0.65, ease: "power3.in" }, 27.7);
      tl.to("#a1-stamp", { scale: 0, opacity: 0, filter: "blur(16px)", duration: 0.55, ease: "power3.in" }, 27.75);
      tl.fromTo("#a1-dot", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(2)" }, 28.15);
      window.__timelines["act1"] = tl;
    })();
  </script>
</template>
