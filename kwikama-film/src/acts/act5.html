  <script>
    /*@HELPERS*/
    (function () {
      const $ = (s) => document.querySelector(s);
      const $$ = (s) => Array.from(document.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      gsap.set("#a5-cur", { opacity: 0 });
      gsap.set(["#a5-world", "#a5-alert", "#a5-count"], { opacity: 0 });

      /* graph of the case, entities and amounts as recorded in DPJ-2026-014 */
      const N = {
        KMP: [380, 650, "soc", "Katanga Mineral Processing", "Société de services · Kolwezi", ""],
        ASH: [930, 360, "soc", "Atlantic Shore Holdings Ltd", "Îles Vierges britanniques · au porteur", ""],
        SIN: [1440, 250, "soc", "Société Immobilière Ngaliema", "Acquisition au comptant", ""],
        IMM: [1560, 640, "bien", "Immeuble R+4 — Lubumbashi", "18 appartements · saisi le 30 sept. 2026", "l"],
        CRY: [1180, 880, "bien", "Portefeuille d'actifs numériques", "Plateforme d'échange étrangère", ""],
        CEN: [800, 112, "inst", "CENAREF", "Traçage des flux", ""],
        DGI: [150, 330, "inst", "DGI", "Déclarations fiscales", ""]
      };
      const nodes = $("#a5-nodes");
      Object.entries(N).forEach(([k, n]) => {
        const d = document.createElement("div"); d.className = "nd " + n[2]; d.id = "a5-" + k;
        d.innerHTML = `<div class="g"></div><div class="c"></div><div class="t ${n[5]}"><div class="n">${n[3]}</div><div class="s">${n[4]}</div></div>`;
        nodes.appendChild(d);
        gsap.set(d, { x: n[0], y: n[1], opacity: 0 });
      });
      // edges: quadratic curves, money in gold, structure dashed
      const E = [
        ["KMP", "ASH", 0.18, "gold"], ["ASH", "SIN", -0.16, "gold"], ["SIN", "IMM", 0.12, "dash"], ["ASH", "CRY", 0.14, "gold"],
        ["CEN", "ASH", 0.0, "grey"], ["DGI", "KMP", 0.0, "grey"]
      ];
      const ctrl = (a, b, bend) => { const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2, dx = b[0] - a[0], dy = b[1] - a[1]; return [mx - dy * bend, my + dx * bend]; };
      const qpt = (a, c, b, t) => [(1 - t) * (1 - t) * a[0] + 2 * (1 - t) * t * c[0] + t * t * b[0], (1 - t) * (1 - t) * a[1] + 2 * (1 - t) * t * c[1] + t * t * b[1]];
      let es = "";
      E.forEach(([a, b, bend, kind], i) => {
        const A = N[a], B = N[b], C = ctrl(A, B, bend);
        const d = `M ${A[0]} ${A[1]} Q ${C[0].toFixed(1)} ${C[1].toFixed(1)} ${B[0]} ${B[1]}`;
        if (kind === "gold") {
          es += `<path id="a5-e${i}b" d="${d}" fill="none" stroke="rgba(244,241,234,.18)" stroke-width="2" stroke-dasharray="8 10"/>`;
          es += `<path id="a5-e${i}" d="${d}" fill="none" stroke="#D8A828" stroke-width="5" stroke-linecap="round"/>`;
        } else if (kind === "dash") es += `<path id="a5-e${i}" d="${d}" fill="none" stroke="rgba(244,241,234,.7)" stroke-width="3" stroke-dasharray="10 10"/>`;
        else es += `<path id="a5-e${i}" d="${d}" fill="none" stroke="rgba(160,170,182,.6)" stroke-width="2.5" stroke-dasharray="6 9"/>`;
      });
      $("#a5-edges").innerHTML = es;
      const glen = (id) => { const p = $(id); return p && p.getTotalLength ? (p.getTotalLength() || 600) : 600; };
      // a pulse travelling along edge i (piecewise, 12 steps)
      const amts = $("#a5-amts");
      let pc = 0;
      function pulse(i, t, dur) {
        const [a, b, bend] = E[i]; const A = N[a], B = N[b], C = ctrl(A, B, bend);
        const el = document.createElement("div"); el.className = "pulse"; el.id = "a5-pu" + (pc++); amts.appendChild(el);
        const P0 = qpt(A, C, B, 0);
        gsap.set(el, { x: P0[0], y: P0[1] });
        tl.set(el, { opacity: 1 }, t);
        for (let s = 1; s <= 12; s++) { const p = qpt(A, C, B, s / 12); tl.to(el, { x: p[0], y: p[1], duration: dur / 12, ease: "none" }, t + (s - 1) * dur / 12); }
        tl.set(el, { opacity: 0 }, t + dur);
      }
      function amount(html, x, y, t) {
        const el = document.createElement("div"); el.className = "amt"; el.innerHTML = html; amts.appendChild(el);
        gsap.set(el, { x, y, opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: 0.6, y: y + 14 }, { opacity: 1, scale: 1, y, duration: 0.35, ease: "back.out(1.7)" }, t);
        return el;
      }
      function light(k, t) {
        tl.to("#a5-" + k, { opacity: 1, duration: 0.3 }, t);
        tl.fromTo("#a5-" + k + " .g", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.45, ease: "expo.out" }, t);
      }
      function draw(i, t, dur) { const L = glen("#a5-e" + i); tl.fromTo("#a5-e" + i, { attr: { "stroke-dasharray": `${L} ${L}`, "stroke-dashoffset": L } }, { attr: { "stroke-dashoffset": 0 }, duration: dur, ease: "power2.inOut" }, t); }
      // hide money edges until drawn
      E.forEach((e, i) => { const L = glen("#a5-e" + i); if (e[3] !== "grey") gsap.set("#a5-e" + i, { attr: { "stroke-dasharray": `${L} ${L}`, "stroke-dashoffset": L } }); else gsap.set("#a5-e" + i, { opacity: 0 }); });
      E.forEach((e, i) => { if (e[3] === "gold") gsap.set("#a5-e" + i + "b", { opacity: 0 }); });

      /* 0. zoom through the real graph into the case world */
      tl.to("#a5-cam", Object.assign({ duration: 1.1, ease: "power3.in" }, camAt(640, 545, 3.4)), 0.0);
      tl.to("#a5-cam", { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power1.in" }, 0.85);
      tl.fromTo("#a5-world", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power1.out" }, 0.8);
      tl.fromTo("#a5-plane", { scale: 1.45, rotationX: 0, rotationY: 0, filter: "blur(14px)" }, { scale: 1, rotationX: 16, rotationY: -4, filter: "blur(0px)", duration: 1.3, ease: "power3.out" }, 0.85);
      tl.to("#a5-plane", { rotationY: 4, rotationX: 12, duration: 9.6, ease: "none" }, 2.15);

      /* 1. the money becomes visible */
      ["KMP", "ASH", "SIN", "IMM", "CRY"].forEach((k, i) => tl.fromTo("#a5-" + k, { opacity: 0, scale: 0.4 }, { opacity: 0.38, scale: 1, duration: 0.5, ease: "expo.out" }, 1.0 + i * 0.12));
      E.forEach((e, i) => { if (e[3] === "gold") tl.to("#a5-e" + i + "b", { opacity: 1, duration: 0.4 }, 1.4); });
      // De Katanga Mineral Processing...
      light("KMP", 2.72);
      // ... vers une société des Îles Vierges britanniques
      draw(0, 4.45, 0.7);
      pulse(0, 4.5, 0.75); pulse(0, 4.95, 0.75); pulse(0, 5.4, 0.75);
      light("ASH", 5.1);
      amount("<b>1 850 000 $US</b> 14 févr. 2026", 470, 384, 5.25);
      amount("<b>2 100 000 $US</b> 28 mars 2026", 470, 450, 5.7);
      amount("<b>2 650 000 $US</b> fractionné en 3 opérations", 470, 516, 6.15);
      // ... puis vers un immeuble à Lubumbashi
      draw(1, 6.95, 0.6); pulse(1, 7.0, 0.65);
      light("SIN", 7.55);
      amount("<b>3 200 000 $US</b> acquisition au comptant", 1200, 140, 7.7);
      draw(2, 7.85, 0.5);
      light("IMM", 8.25);
      /* 2. payoff: the whole case at a glance */
      draw(3, 9.15, 0.6); pulse(3, 9.2, 0.65);
      light("CRY", 9.75);
      amount("<b>2 264 000 $US</b> conversion rapide", 1300, 770, 9.85);
      tl.to(["#a5-CEN", "#a5-DGI"], { opacity: 0.85, duration: 0.4 }, 9.7);
      tl.to(["#a5-e4", "#a5-e5"], { opacity: 1, duration: 0.4 }, 9.8);
      tl.fromTo("#a5-alert", { opacity: 0, x: -40, filter: "blur(8px)" }, { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.6, ease: "expo.out" }, 10.0);
      tl.fromTo("#a5-count", { opacity: 0, x: 40, filter: "blur(8px)" }, { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.6, ease: "expo.out" }, 10.2);
      /* 3. hand-off: the graph folds into Katanga Mineral Processing, which opens as an exhibit */
      tl.to(["#a5-alert", "#a5-count"], { opacity: 0, filter: "blur(8px)", duration: 0.3 }, 11.7);
      tl.to(["#a5-ASH", "#a5-SIN", "#a5-IMM", "#a5-CRY", "#a5-CEN", "#a5-DGI", "#a5-edges", "#a5-amts", "#a5-grid"], { opacity: 0, filter: "blur(10px)", duration: 0.45, ease: "power2.in" }, 11.75);
      tl.to("#a5-plane", { rotationX: 0, rotationY: 0, duration: 0.6, ease: "power2.inOut" }, 11.8);
      tl.fromTo("#a5-morph", { x: N.KMP[0], y: N.KMP[1], scaleX: 52 / 1180, scaleY: 52 / 430, borderRadius: "300px", opacity: 0 },
        { x: 960, y: 540, scaleX: 1, scaleY: 1, borderRadius: "22px", opacity: 1, duration: 0.75, ease: "power3.inOut" }, 12.0);
      tl.to("#a5-KMP", { opacity: 0, duration: 0.2 }, 12.05);
      window.__timelines["act5"] = tl;
    })();
  </script>
