<template>
  <style>
    /*@BASE*/
    #root { background: var(--navy); }
    .g-arc { position: absolute; border-radius: 50%; }
    #g-blue { left: -1500px; top: -1900px; width: 2900px; height: 2900px;
      background: conic-gradient(from 90deg, rgba(46,109,180,0) 0deg, rgba(46,109,180,.0) 30deg, rgba(58,124,201,.62) 75deg, rgba(19,72,127,.42) 120deg, rgba(19,72,127,0) 170deg, rgba(19,72,127,0) 360deg);
      -webkit-mask-image: radial-gradient(circle, transparent 0, transparent 61%, #000 64.5%, #000 65.6%, transparent 69.5%);
      mask-image: radial-gradient(circle, transparent 0, transparent 61%, #000 64.5%, #000 65.6%, transparent 69.5%); }
    #g-blue-soft { left: -1500px; top: -1900px; width: 2900px; height: 2900px;
      background: radial-gradient(circle, rgba(19,72,127,0) 58%, rgba(19,72,127,.20) 66%, rgba(19,72,127,0) 76%); }
    #g-gold { left: 980px; top: 640px; width: 2500px; height: 2500px;
      background: conic-gradient(from 250deg, rgba(216,168,40,0) 0deg, rgba(236,198,87,.55) 50deg, rgba(216,168,40,.32) 95deg, rgba(216,168,40,0) 150deg, rgba(216,168,40,0) 360deg);
      -webkit-mask-image: radial-gradient(circle, transparent 0, transparent 60.5%, #000 64%, #000 65%, transparent 69%);
      mask-image: radial-gradient(circle, transparent 0, transparent 60.5%, #000 64%, #000 65%, transparent 69%); }
    #g-gold-soft { left: 980px; top: 640px; width: 2500px; height: 2500px;
      background: radial-gradient(circle, rgba(216,168,40,0) 57%, rgba(216,168,40,.10) 65%, rgba(216,168,40,0) 75%); }
    #g-vig { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, rgba(3,24,41,0) 55%, rgba(1,10,18,.55) 100%); }
    #g-net { position: absolute; left: -80px; top: -60px; width: 2080px; height: 1200px; opacity: .16; }
  </style>
  <div id="root" data-composition-id="ground" data-width="1920" data-height="1080">
    <div class="g-arc" id="g-blue-soft" data-layout-ignore></div>
    <div class="g-arc" id="g-blue" data-layout-ignore></div>
    <div class="g-arc" id="g-gold-soft" data-layout-ignore></div>
    <div class="g-arc" id="g-gold" data-layout-ignore></div>
    <svg id="g-net" viewBox="0 0 2080 1200"></svg>
    <div id="g-vig"></div>
  </div>
  <script>
    /*@HELPERS*/
    (function () {
      // site-style constellation: seeded nodes, each linked to its two nearest neighbours
      const net = document.getElementById("g-net");
      const r = rng(7), pts = [];
      for (let i = 0; i < 26; i++) pts.push([60 + r() * 1960, 40 + r() * 1120]);
      const seen = new Set();
      let s = "";
      pts.forEach((p, i) => {
        const near = pts.map((q, j) => [j, Math.hypot(q[0] - p[0], q[1] - p[1])]).filter(a => a[0] !== i).sort((a, b) => a[1] - b[1]).slice(0, 2);
        near.forEach(([j]) => { const k = i < j ? i + "-" + j : j + "-" + i; if (seen.has(k)) return; seen.add(k);
          s += `<line x1="${p[0].toFixed(1)}" y1="${p[1].toFixed(1)}" x2="${pts[j][0].toFixed(1)}" y2="${pts[j][1].toFixed(1)}" stroke="#D8A828" stroke-width="1.3"/>`; });
      });
      pts.forEach(p => { s += `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4.5" fill="#D8A828"/>`; });
      net.innerHTML = s;
      const tl = gsap.timeline({ paused: true });
      const D = 127;
      tl.fromTo("#g-blue", { rotation: -10 }, { rotation: 42, duration: D, ease: "none" }, 0);
      tl.fromTo("#g-gold", { rotation: 6 }, { rotation: -40, duration: D, ease: "none" }, 0);
      tl.fromTo("#g-net", { x: 0, y: 0 }, { x: -70, y: -24, duration: D, ease: "none" }, 0);
      window.__timelines["ground"] = tl;
    })();
  </script>
</template>
