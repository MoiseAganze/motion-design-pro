      // the night-blue panel of the last screen opens onto the night of the film

      /* the shield forms on "KWIKAMA" (144.46) */

      svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
      const NODES = [[164.9, 47.2, 9.6], [239.9, 102.7, 10.6], [138.5, 158.5, 7.0], [256.0, 165.4, 6.4], [226.3, 182.5, 12.6], [105.4, 258.6, 10.6], [165.9, 282.8, 8.8]];
      const C = [1104, 1384];
      const defs = document.createElementNS(NS, "defs");
      defs.innerHTML = '<mask id="s6-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="2208" height="2768"><circle id="s6-mc" cx="1104" cy="1384" r="0" fill="#fff"/></mask>';
      svg.insertBefore(defs, svg.firstChild);
      $("#s6-logo-gold").setAttribute("mask", "url(#s6-mask)");
      const ng = document.createElementNS(NS, "g");
      NODES.forEach(([x, y, r], i) => { const c = document.createElementNS(NS, "circle"); c.setAttribute("fill", "#D5AC3C"); c.setAttribute("cx", C[0]); c.setAttribute("cy", C[1]); c.setAttribute("r", 0); c.id = "s6-n" + i; ng.appendChild(c); });
      svg.appendChild(ng);
      gsap.set(["#s6-logo-navy", "#s6-logo-sil"], { opacity: 0 });
      const R = at(144.46);
      tl.set("#s6-flash", { x: 550, y: 440 }, 0);
      tl.fromTo("#s6-flash", { scale: 0.4, opacity: 1 }, { scale: 22, opacity: 0, duration: 0.9, ease: "power2.out", immediateRender: false }, R - 0.05);
      NODES.forEach(([x, y, r], i) => {
        tl.fromTo("#s6-n" + i, { attr: { cx: C[0], cy: C[1], r: 0 } }, { attr: { cx: x * 8, cy: y * 8, r: r * 8 }, duration: 0.7, ease: "expo.out" }, R + i * 0.04);
      });
      tl.fromTo("#s6-mc", { attr: { r: 0 } }, { attr: { r: 1900 }, duration: 0.8, ease: "power2.inOut" }, R + 0.3);

      tl.fromTo("#s6-rule", { opacity: 1, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.45, ease: "power3.out" }, at(145.25));
      tl.fromTo("#s6-tag", { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "power2.out" }, at(145.38));

      /* the six institutions around the shield, as in the opening */
      const NAMES = ["Parquet Général", "CENAREF", "APLC", "COGEBISCO", "GUCE", "IGF"];
      const ring = $("#s6-ring"), labs = $("#s6-labs");

        const a = -Math.PI / 2 + i * (Math.PI / 3);
        const x = 960 + 860 * Math.cos(a), y = 520 + 360 * Math.sin(a);
        const L = Math.hypot(x - 550, y - 440);
        rs += `<line id="s6-l${i}" x1="${x.toFixed(1)}" y1="${y.toFixed(1)}" x2="550" y2="440" stroke="#D8A828" stroke-width="1.8" opacity="0.4" stroke-dasharray="${L.toFixed(1)} ${L.toFixed(1)}" stroke-dashoffset="${L.toFixed(1)}"/>`;
        rs += `<circle id="s6-d${i}" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="10" fill="#ECC657" opacity="0"/>`;
        const lb = document.createElement("div"); lb.className = "s6-lab"; lb.id = "s6-lb" + i; lb.textContent = n;
        lb.style.left = x + "px"; lb.style.top = (y + (Math.sin(a) < -0.5 ? -48 : 20)) + "px";
        labs.appendChild(lb);
      });
      ring.innerHTML = rs;
      NAMES.forEach((n, i) => {
        tl.fromTo("#s6-d" + i, { opacity: 0, scale: 0, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)", immediateRender: false }, at(146.3) + i * 0.08);

      $$(".s6-pl").forEach((p, i) => {
        tl.fromTo(p, { opacity: 0, y: 18, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "expo.out" }, at(146.2) + i * 0.22);
        tl.fromTo(p.querySelector("i"), { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power3.out" }, at(146.25) + i * 0.22);
      });
      tl.fromTo("#s6-foot", { opacity: 0 }, { opacity: 1, duration: 0.7, ease: "power1.out" }, at(147.0));
      window.__timelines["s6"] = tl;
    })();
