  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const C = { x: 960, y: 580 };

      // ---- 0.0: the drop. The shrunken clock of s1 becomes the n8n mark.
      tl.fromTo("#s2-hub", { scale: 0.12 }, { scale: 1, duration: 0.7, ease: "back.out(1.5)" }, 0);
      tl.fromTo("#s2-hub img", { rotation: -90, scale: 0.6 }, { rotation: 0, scale: 1, duration: 0.8, ease: "expo.out" }, 0.02);
      tl.fromTo("#s2-light", { scale: 0.7, opacity: 0.4 }, { scale: 1, opacity: 1, duration: 1.2, ease: "expo.out" }, 0);
      tl.fromTo("#s2-word span", { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power2.out" }, 0.3);

      // the apps burst back out of the centre onto a ring
      const tiles = ["#s2-t-gmail", "#s2-t-cal", "#s2-t-wa", "#s2-t-tg", "#s2-t-drive", "#s2-t-sheets"];
      const pos = [
        [490, 477],
        [873, 285],
        [1343, 387],
        [1430, 683],
        [1047, 875],
        [577, 773],
      ];
      tiles.forEach((t, i) => {
        tl.fromTo(
          t,
          { x: C.x - pos[i][0], y: C.y - pos[i][1], scale: 0.2, opacity: 0 },
          { x: 0, y: 0, scale: 1, opacity: 1, duration: 0.75, ease: "expo.out" },
          0.12 + i * 0.05
        );
      });

      // ---- "vos applications se parlent" (1.2): wires draw, data travels both ways
      const wires = ["#s2-w1", "#s2-w2", "#s2-w3", "#s2-w4", "#s2-w5", "#s2-w6"];
      wires.forEach((w, i) => {
        const len = document.querySelector(w).getTotalLength() || 600;
        tl.fromTo(w, { strokeDasharray: len, strokeDashoffset: len }, { strokeDashoffset: 0, duration: 0.5, ease: "power2.inOut" }, 1.15 + i * 0.07);
      });
      tl.to("#s2-word span", { opacity: 0, filter: "blur(8px)", duration: 0.16, ease: "power2.in" }, 1.08);
      tl.fromTo("#s2-title span", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.16, stagger: 0.08, ease: "power2.out" }, 1.25);
      const dots = ["#s2-d1", "#s2-d2", "#s2-d3", "#s2-d4", "#s2-d5", "#s2-d6"];
      dots.forEach((d, i) => {
        const inward = i % 2 === 0;
        tl.set(d, { opacity: 0 }, 0);
        tl.fromTo(
          d,
          { opacity: 1, motionPath: { path: wires[i], align: wires[i], start: inward ? 0 : 1, end: inward ? 0 : 1 } },
          { motionPath: { path: wires[i], align: wires[i], start: inward ? 0 : 1, end: inward ? 1 : 0 }, duration: 0.7, ease: "power1.inOut" },
          1.55 + i * 0.1
        );
        tl.to(d, { opacity: 0, duration: 0.1 }, 1.55 + i * 0.1 + 0.7);
      });
      tl.fromTo("#s2-hub", { boxShadow: "0 30px 70px rgba(11,42,69,0.2), 0 0 0 0 rgba(10,164,188,0)" }, { boxShadow: "0 30px 70px rgba(11,42,69,0.2), 0 0 0 16px rgba(10,164,188,0.25)", duration: 0.25, yoyo: true, repeat: 3, ease: "power1.inOut" }, 1.9);

      // ---- "et vos tâches s'enchaînent automatiquement" (2.6): the ring straightens into a chain
      tl.to("#s2-ring-wires", { opacity: 0, duration: 0.25, ease: "power2.in" }, 2.55);
      tl.to(["#s2-t-cal", "#s2-t-tg", "#s2-t-drive"], { opacity: 0, scale: 0.5, filter: "blur(8px)", duration: 0.35, ease: "power3.in" }, 2.6);
      tl.to("#s2-t-gmail", { x: 380 - 490, y: 600 - 477, duration: 0.6, ease: "power3.inOut" }, 2.62);
      tl.to("#s2-hub", { x: 800 - 960, y: 600 - 580, scale: 0.85, duration: 0.6, ease: "power3.inOut" }, 2.62);
      tl.to("#s2-t-sheets", { x: 1180 - 577, y: 600 - 773, duration: 0.6, ease: "power3.inOut" }, 2.66);
      tl.to("#s2-t-wa", { x: 1540 - 1343, y: 600 - 387, duration: 0.6, ease: "power3.inOut" }, 2.7);
      ["#s2-c1", "#s2-c2", "#s2-c3"].forEach((w, i) => {
        const len = document.querySelector(w).getTotalLength() || 250;
        tl.fromTo(w, { strokeDasharray: len, strokeDashoffset: len }, { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, 3.2 + i * 0.12);
      });
      ["#s2-e1", "#s2-e2", "#s2-e3"].forEach((d, i) => {
        const w = ["#s2-c1", "#s2-c2", "#s2-c3"][i];
        tl.set(d, { opacity: 0 }, 0);
        tl.fromTo(d, { opacity: 1, motionPath: { path: w, align: w, start: 0, end: 0 } }, { motionPath: { path: w, align: w, start: 0, end: 1 }, duration: 0.32, ease: "none" }, 3.4 + i * 0.3);
        tl.to(d, { opacity: 0, duration: 0.06 }, 3.72 + i * 0.3);
      });

      // ---- dive (3.9): the camera falls into the Gmail node, which becomes the n8n canvas
      tl.to("#s2-title span", { opacity: 0, filter: "blur(8px)", duration: 0.18, stagger: 0.03, ease: "power2.in" }, 3.75);
      tl.fromTo("#s2-cam", { scale: 1, x: 0, y: 0 }, { scale: 20, x: 580, y: -60, duration: 0.7, ease: "power3.in" }, 3.9);
      // at the fastest frame the node switches to n8n's canvas, and the whole frame follows
      tl.to("#s2-chain-wires", { opacity: 0, duration: 0.15 }, 4.1);
      tl.set("#s2-gmail-dark", { opacity: 1 }, 4.3);
      tl.set("#s2-t-gmail img", { opacity: 0 }, 4.3);
      tl.to("#s2-night", { opacity: 1, duration: 0.2, ease: "power2.in" }, 4.36);
      tl.to("#s2-light", { opacity: 0, duration: 0.3 }, 4.2);

      window.__timelines["s2"] = tl;
    })();
  </script>
