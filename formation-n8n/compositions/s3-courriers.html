          tl.fromTo(pkt, { opacity: 1, motionPath: { path: wire, start: 0, end: 0 } }, { motionPath: { path: wire, start: 0, end: 1 }, duration: at - t0, ease: "none" }, t0);
          tl.set(pkt, { opacity: 0 }, at);
          tl.set(pkt, { opacity: 0 }, 0);
          tl.to(wire, { stroke: "#00C950", duration: 0.15 }, at);
        }
        tl.to(node, { borderColor: "#00C950", duration: 0.12 }, at);
        tl.fromTo(node, { scale: 1 }, { scale: 1.07, duration: 0.11, yoyo: true, repeat: 1, ease: "power2.out" }, at);
        tl.fromTo(node + " .s3-ok", { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, at + 0.04);
      });
      // the agent consults its model and its parser
      tl.to(["#s3-s-model", "#s3-s-parser"], { borderColor: "#00C950", duration: 0.12, stagger: 0.12 }, 2.62);

      // ---- "…et la réponse part" (4.44): the acknowledgement leaves the last node
      tl.fromTo("#s3-reply", { opacity: 0, x: -120, scale: 0.6 }, { opacity: 1, x: 0, scale: 1, duration: 0.45, ease: "expo.out" }, 4.22);
      tl.to("#s3-reply", { opacity: 0, x: 180, duration: 0.25, ease: "power3.in" }, 5.0);

      // ---- proof: the camera lands exactly on the real workflow
      tl.to("#s3-bar", { opacity: 0, duration: 0.3 }, 4.65);
      tl.fromTo("#s3-shot", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.inOut" }, 5.08);
      tl.to(cam, { opacity: 0, duration: 0.2 }, 5.25);

      window.__timelines["s3"] = tl;
    })();
  </script>
