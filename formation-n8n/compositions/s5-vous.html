  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });

      // ---- the canvas recedes from s4 and "VOUS" takes the frame

      tl.fromTo("#s5-cest", { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power2.out" }, 0.45);
      // "VOUS" (1.24): one letter at a time, landing hard
      tl.fromTo("#s5-vous span", { opacity: 0, scale: 1.6, filter: "blur(12px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.28, stagger: 0.07, ease: "expo.out" }, 1.08);
      tl.fromTo("#s5-cmd span", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.16, stagger: 0.09, ease: "power2.out" }, 1.55);
      tl.to("#s5-big", { opacity: 0, scale: 0.92, filter: "blur(10px)", duration: 0.25, ease: "power3.in" }, 2.05);

      // ---- "Étape par étape" (2.2): the cursor builds the workflow one node at a time
      tl.fromTo("#s5-head span", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.16, stagger: 0.07, ease: "power2.out" }, 2.3);
      tl.fromTo("#s5-add", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.8)" }, 2.1);
      tl.fromTo("#s5-cursor", { x: 760, y: 1120 }, { x: 330, y: 610, duration: 0.3, ease: "power3.out" }, 2.0);

      const steps = [
        // [node, plus that leads to it, wire, click time, cursor target]
        ["#s5-n1", "#s5-add", null, 2.3, [330, 610]],
        ["#s5-n2", "#s5-p1", "#s5-w1", 2.75, [465, 610]],
        ["#s5-n3", "#s5-p2", "#s5-w2", 3.2, [735, 610]],
        ["#s5-n4", "#s5-p3", "#s5-w3", 3.65, [1005, 610]],
      ];
      steps.forEach(([node, plus, wire, at, c], i) => {
        if (i > 0) {
          tl.fromTo(plus, { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.18, ease: "back.out(2)" }, at - 0.32);
          tl.to("#s5-cursor", { x: c[0], y: c[1], duration: 0.26, ease: "power3.inOut" }, at - 0.3);
        }
        // the click: the cursor dips, the + becomes the node
        tl.to("#s5-cursor", { scale: 0.86, duration: 0.06, yoyo: true, repeat: 1, ease: "power1.inOut", transformOrigin: "4px 3px" }, at - 0.04);
        tl.to(plus, { opacity: 0, scale: 0.6, duration: 0.12, ease: "power2.in" }, at);
        if (wire) {
          const len = document.querySelector(wire).getTotalLength() || 140;
          tl.fromTo(wire, { strokeDasharray: len, strokeDashoffset: len }, { strokeDashoffset: 0, duration: 0.2, ease: "power2.out" }, at);
        }
        tl.fromTo(node, { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.7)" }, at + 0.04);
      });

      // ---- "jusqu'aux agents IA" (3.88): the agent lands with its model, memory and tool ports
      tl.fromTo("#s5-p4", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.18, ease: "back.out(2)" }, 3.78);
      tl.to("#s5-cursor", { x: 1290, y: 610, duration: 0.24, ease: "power3.inOut" }, 3.8);
      tl.to("#s5-cursor", { scale: 0.86, duration: 0.06, yoyo: true, repeat: 1, ease: "power1.inOut", transformOrigin: "4px 3px" }, 4.06);
      tl.to("#s5-p4", { opacity: 0, scale: 0.6, duration: 0.12 }, 4.1);
      const l4 = document.querySelector("#s5-w4").getTotalLength() || 185;
      tl.fromTo("#s5-w4", { strokeDasharray: l4, strokeDashoffset: l4 }, { strokeDashoffset: 0, duration: 0.2, ease: "power2.out" }, 4.1);
      tl.fromTo("#s5-agent", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.6)" }, 4.14);
      tl.to("#s5-cursor", { x: 1900, y: 1150, duration: 0.35, ease: "power3.in" }, 4.22);
      ["#s5-d1", "#s5-d2", "#s5-d3"].forEach((d, i) => tl.fromTo(d, { opacity: 0 }, { opacity: 1, duration: 0.15 }, 4.3 + i * 0.05));
      tl.fromTo(["#s5-pt1", "#s5-pt2", "#s5-pt3"], { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.25, stagger: 0.05, ease: "power2.out" }, 4.3);
      tl.fromTo("#s5-sub1", { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)" }, 4.38);
      tl.fromTo(["#s5-sub2", "#s5-sub3"], { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.25, stagger: 0.05, ease: "back.out(2)" }, 4.42);

      // ---- colour flood (4.7): the agent opens onto the bright world of s6
      tl.fromTo("#s5-iris", { scale: 0 }, { scale: 40, duration: 0.42, ease: "power3.in" }, 4.58);

      window.__timelines["s5"] = tl;
    })();
