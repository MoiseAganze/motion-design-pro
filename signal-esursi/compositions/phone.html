                <rect x="49" y="3" width="14" height="7" rx="1.5" /><rect x="68" y="4.5" width="1.6" height="4" rx=".8" fill-opacity=".55" />
              </g>
            </svg>
            <div class="pf-island"></div>
          </div>
          <div class="pf-bar">
            <div class="pf-url">
              <svg viewBox="0 0 11 13" aria-hidden="true"><path fill="#4b5563" d="M2 6V4a3.5 3.5 0 0 1 7 0v2h.5A1.5 1.5 0 0 1 11 7.5v4A1.5 1.5 0 0 1 9.5 13h-8A1.5 1.5 0 0 1 0 11.5v-4A1.5 1.5 0 0 1 1.5 6zm1.5 0h4V4a2 2 0 0 0-4 0z" /></svg>
              <span>signal.minesursi.gouv.cd</span>
            </div>
            <div class="pf-home"></div>
          </div>
        </div>
      </div>
    </div>
    <div id="ph-edge"></div>
  </div>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      // local time = film time - 22.2
      const L = (film) => +(film - 22.2).toFixed(3);
      const PH = "#ph";
      // --- the phone world wipes in on the flag diagonal
      tl.to("#ph-scene", { clipPath: "polygon(0px 0px, 2200px 0px, 1950px 1080px, 0px 1080px)", duration: 0.55, ease: "power3.inOut" }, 0);
      tl.fromTo("#ph-edge", { x: 14, rotation: 13 }, { x: 2214, rotation: 13, duration: 0.55, ease: "power3.inOut" }, 0);
      tl.fromTo("#ph-stripe", { x: -80, rotation: -25 }, { x: 60, rotation: -25, duration: 15.3, ease: "none" }, 0);

      // --- "Depuis votre téléphone": the phone rises and sends its signal
      const REST_A = { x: 748, y: 76, scale: 1.08 };
      const PUSH = { x: 772.5, y: -252, scale: 1.5 };
      const REST_B = { x: 140, y: 76, scale: 1.08 };
      tl.fromTo(PH, { x: REST_A.x, y: 1180, scale: REST_A.scale, rotation: 6, transformOrigin: "0px 0px" },
        { x: REST_A.x, y: REST_A.y, rotation: 0, duration: 0.9, ease: "expo.out" }, 0.1);
      [0, 1, 2, 3].forEach((i) => {
        const id = "#ph-ring-" + ((i % 3) + 1);
        tl.fromTo(id, { opacity: 0.4, scale: 0.75 }, { opacity: 0, scale: 1.9, duration: 1.6, ease: "power1.out", immediateRender: false }, 0.55 + i * 0.5);
      });

      // --- page states
      const show = (id, t, scroll, slide) => {
        tl.set("#ph-page .pf-st", { opacity: 0 }, t);
        tl.set("#ph-page", { y: -scroll }, t);
        if (slide) tl.fromTo(id, { opacity: 0, x: 36 }, { opacity: 1, x: 0, duration: 0.24, ease: "expo.out" }, t);
        else tl.set(id, { opacity: 1, x: 0 }, t);
        tl.set("#ph-sticky", { opacity: scroll >= 139 ? 1 : 0 }, t);
      };
      const tap = (x, y, t) => {
        tl.set("#ph-touch", { x: x, y: y }, t - 0.12);
        tl.fromTo("#ph-touch", { opacity: 0, scale: 1.35 }, { opacity: 1, scale: 1, duration: 0.1, ease: "power2.out" }, t - 0.12);
        tl.to("#ph-touch", { scale: 0.82, duration: 0.06, ease: "power2.in" }, t - 0.02);
        tl.to("#ph-touch", { scale: 1.1, opacity: 0, duration: 0.18, ease: "power2.out" }, t + 0.06);
      };
      show("#st-home", 0, 0, false);

      // --- "vous déposez un signalement": push in on the real button, tap
      tl.to(PH, { ...PUSH, duration: 0.55, ease: "power2.inOut" }, L(23.42));
      tap(125, 481, L(23.98));
      show("#st-s1a", L(24.12), 0, true);
      tl.to(PH, { ...REST_A, duration: 0.6, ease: "power2.inOut" }, L(24.5));
      tl.to("#ph-page", { y: -330, duration: 0.5, ease: "power2.inOut" }, L(24.75));
      tl.set("#ph-sticky", { opacity: 1 }, L(24.95));

      // --- "en quelques minutes": a stopwatch that runs fast
      tl.fromTo("#ph-sw", { opacity: 0, scale: 0.6, rotation: -14, transformOrigin: "50% 60%" },
        { opacity: 1, scale: 1, rotation: 0, duration: 0.45, ease: "back.out(1.7)" }, L(24.9));
      tl.fromTo("#ph-sw-hand", { rotation: 0, svgOrigin: "160 190" }, { rotation: 720, svgOrigin: "160 190", duration: 1.15, ease: "power1.inOut" }, L(25.0));
      tl.fromTo("#ph-sw-pie", { strokeDashoffset: 339.3 }, { strokeDashoffset: 0, duration: 1.15, ease: "power1.inOut" }, L(25.0));
      tl.fromTo("#ph-sw-l", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: "expo.out" }, L(25.05));
      tl.to(["#ph-sw", "#ph-sw-l"], { opacity: 0, x: 120, duration: 0.3, ease: "power2.in" }, L(25.95));
      tl.to(PH, { ...REST_B, duration: 0.55, ease: "power2.inOut" }, L(25.88));

      // --- "13 catégories officielles": the categories burst out of the screen
      const TILES = [[882.0, 405.0], [1134.0, 405.0], [1386.0, 405.0], [1638.0, 405.0], [756.0, 635.0], [1008.0, 635.0], [1260.0, 635.0], [1512.0, 635.0], [1764.0, 635.0], [882.0, 865.0], [1134.0, 865.0], [1386.0, 865.0], [1638.0, 865.0]];
      const OX = REST_B.x + 196.5 * 1.08, OY = REST_B.y + 426 * 1.08;
      const T13 = L(26.19);
      tl.fromTo("#ph-n13", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.4, ease: "expo.out" }, T13 - 0.06);
      tl.fromTo("#ph-w-cat", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.35, ease: "expo.out" }, L(26.43));
      tl.fromTo("#ph-w-off", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.35, ease: "expo.out" }, L(26.99));
      tl.to("#ph-ul13", { scaleX: 1, duration: 0.45, ease: "expo.out" }, L(27.1));
      TILES.forEach(([cx, cy], i) => {
        const t = T13 + i * 0.045;
        const rot = ((i * 37) % 21) - 10;
        tl.fromTo("#ct-" + (i + 1), { opacity: 0, x: OX - cx, y: OY - cy, scale: 0.25, rotation: rot },
          { opacity: 1, x: 0, y: 0, scale: 1, rotation: 0, duration: 0.6, ease: "expo.out" }, t);
      });

      // the four the voice names light up; the rest step back
      const others = [2, 4, 6, 7, 8, 9, 11, 12, 13].map((n) => "#ct-" + n);
      tl.to(others, { opacity: 0.38, duration: 0.3, ease: "power1.out" }, L(27.82));
      tl.to(["#ct-1", "#ct-3", "#ct-5", "#ct-10"], { opacity: 0.38, duration: 0.3, ease: "power1.out" }, L(27.82));
      const lightUp = (n, film, bounce) => {
        const t = L(film);
        tl.to("#ct-" + n, { opacity: 1, scale: 1.1, duration: 0.35, ease: "back.out(2)" }, t);
        tl.to("#ct-hl-" + n, { opacity: 1, duration: 0.15 }, t);
        tl.to("#ct-i-" + n, { keyframes: bounce, duration: 0.5, ease: "power1.inOut" }, t);
        tl.to("#ct-" + n, { scale: 1.04, duration: 0.3, ease: "power2.out" }, t + 0.55);
      };
      lightUp(1, 28.03, [{ y: -16, rotation: -8 }, { y: 0, rotation: 6 }, { y: 0, rotation: 0 }]);
      tap(196, 796, L(28.03));
      tl.set("#st-s1b", { opacity: 1 }, L(28.06));
      lightUp(3, 28.83, [{ scale: 1.2 }, { scale: 0.92 }, { scale: 1 }]);
      lightUp(5, 29.83, [{ x: -8 }, { x: 8 }, { x: -5 }, { x: 0 }]);
      lightUp(10, 30.59, [{ rotation: -14 }, { rotation: 8 }, { rotation: 0 }]);
      // "de ... à ...": the whole range, and the misappropriation of funds in gold
      tl.to(others, { opacity: 1, duration: 0.3, stagger: 0.035, ease: "power1.out" }, L(31.1));
      tl.to("#ct-hl-8", { opacity: 1, duration: 0.2 }, L(31.32));
      tl.fromTo("#ct-8", { scale: 1 }, { scale: 1.1, duration: 0.25, ease: "back.out(2.5)" }, L(31.32));
      tl.to("#ct-i-8", { keyframes: [{ rotation: -12, y: -8 }, { rotation: 10, y: 0 }, { rotation: 0 }], duration: 0.45 }, L(31.32));

      // --- the categories return into the phone
      const TB = L(31.82);
      TILES.forEach(([cx, cy], i) => {
        tl.to("#ct-" + (i + 1), { x: OX - cx, y: OY - cy, scale: 0.2, opacity: 0, duration: 0.4, ease: "power3.in" }, TB + (12 - i) * 0.02);
      });
      tl.to(["#ph-n13", "#ph-hd13"], { opacity: 0, y: -40, duration: 0.3, ease: "power2.in" }, TB);

      // --- "8 étapes guidées": the form's real steps, with the real screen beside
      const T8 = L(32.31);
      tl.fromTo("#ph-n8", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.4, ease: "expo.out" }, T8 - 0.06);
      tl.fromTo("#ph-w-eta", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.35, ease: "expo.out" }, L(32.51));
      tl.fromTo("#ph-w-gui", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.35, ease: "expo.out" }, L(32.85));
      tl.to("#ph-ul8", { scaleX: 1, duration: 0.45, ease: "expo.out" }, L(33.0));
      tl.fromTo("#sr-line", { opacity: 0 }, { opacity: 1, duration: 0.3 }, T8);
      for (let n = 1; n <= 8; n++) {
        tl.fromTo("#sr-" + n, { opacity: 0, x: 70 }, { opacity: 1, x: 0, duration: 0.45, ease: "expo.out" }, T8 + 0.05 + (n - 1) * 0.06);
      }
      tl.fromTo("#sr-ok-1", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2.5)" }, L(32.95));
      const RY = (n) => 290 + (n - 1) * 86;
      const motions = {
        2: { from: { y: -26 }, to: { y: 0, duration: 0.55, ease: "bounce.out" } },
        3: { from: { scaleY: 0.4, transformOrigin: "50% 100%" }, to: { scaleY: 1, duration: 0.45, ease: "back.out(2)" } },
        4: { from: { scale: 0.5, transformOrigin: "50% 50%" }, to: { scale: 1, duration: 0.4, ease: "back.out(2)" } },
        5: { from: { rotation: -24, transformOrigin: "20% 80%" }, to: { rotation: 0, duration: 0.6, ease: "elastic.out(1.2, 0.4)" } },
        6: { from: { y: 18, rotation: 14 }, to: { y: 0, rotation: 0, duration: 0.45, ease: "back.out(2)" } },
        7: { from: { scale: 0.5, transformOrigin: "50% 50%" }, to: { scale: 1, duration: 0.4, ease: "back.out(2)" } },
      };
      let prev = 0;
      const activate = (n, film) => {
        const t = L(film);
        if (prev === 0) {
          tl.set("#sr-pill", { y: RY(n) - 376 }, t - 0.12);
          tl.fromTo("#sr-pill", { opacity: 0, scaleX: 0.2, transformOrigin: "0% 50%" }, { opacity: 1, scaleX: 1, duration: 0.35, ease: "expo.out" }, t - 0.12);
        } else {
          tl.to("#sr-pill", { y: RY(n) - 376, duration: 0.3, ease: "power3.inOut" }, t - 0.12);
          tl.to("#sr-l-" + prev, { color: "#0f2744", duration: 0.15 }, t - 0.05);
          tl.to("#sr-l-" + prev + " b", { color: "#0057b8", duration: 0.15 }, t - 0.05);
          tl.fromTo("#sr-ok-" + prev, { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2.5)" }, t);
        }
        tl.to("#sr-l-" + n, { color: "#ffffff", duration: 0.15 }, t + 0.05);
        tl.to("#sr-l-" + n + " b", { color: "#f7d618", duration: 0.15 }, t + 0.05);
        tl.to("#sr-fill", { scaleY: (n - 1) / 7, duration: 0.35, ease: "power2.out" }, t - 0.1);
        const m = motions[n];
        if (m) tl.fromTo("#sr-i-" + n, m.from, m.to, t);
        prev = n;
      };

      show("#st-s2a", L(33.55), 330, true);
      activate(2, 33.71);
      tap(196, 797, L(34.02));
      tl.set("#st-s2b", { opacity: 1 }, L(34.05));
      show("#st-s3", L(34.38), 400, true);
      activate(3, 34.48);
      show("#st-s4", L(35.08), 330, true);
      activate(4, 35.12);
      show("#st-s5a", L(35.52), 330, true);
      activate(5, 35.67);
      // typing: the placeholder clears, the text arrives line by line
      tl.set(["#bl-t", "#bl-d"], { opacity: 1 }, L(35.72));
      tl.set(["#ty-t", "#ty-d1", "#ty-d2", "#ty-d3"], { opacity: 1 }, L(35.72));
      tl.fromTo("#ty-t", { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.26, ease: "none" }, L(35.72));
      tl.fromTo("#ty-d1", { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.2, ease: "none" }, L(36.0));
      tl.fromTo("#ty-d2", { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.2, ease: "none" }, L(36.2));
      tl.fromTo("#ty-d3", { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.12, ease: "none" }, L(36.4));
      tl.set("#st-s5b", { opacity: 1 }, L(36.52));
      show("#st-s6a", L(36.55), 330, true);
      tl.set(["#bl-t", "#bl-d"], { opacity: 0 }, L(36.55));
      activate(6, 36.62);
      tl.set("#st-s6b", { opacity: 1 }, L(36.8));
      tl.fromTo("#st-s6b", { clipPath: "inset(898px 40px 334px 40px)" }, { clipPath: "inset(0px 0px 0px 0px)", duration: 0.3, ease: "expo.out" }, L(36.8));

      // --- hand-off: the "Mode" step stays, everything else steps aside
      show("#st-s7", L(37.06), 330, true);
      activate(7, 37.22);
      const rest = [1, 2, 3, 4, 5, 6, 8].map((n) => "#sr-" + n);
      tl.to(rest, { opacity: 0, x: -30, duration: 0.2, ease: "power2.in", stagger: 0.015 }, L(37.2));
      tl.to(["#sr-line", "#ph-n8", "#ph-hd8"], { opacity: 0, duration: 0.2, ease: "power2.in" }, L(37.2));
      window.__timelines["phone"] = tl;
    })();
  </script>
</template>
