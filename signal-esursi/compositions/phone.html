    (function () {
      const tl = gsap.timeline({ paused: true });
      // local time = film time - 19.15

      const PH = "#ph";

      // --- camera states (phone local units = screen css px)
      const REST = { x: 690, y: 76, scale: 1.08 };
      const PUNCH = { x: 300, y: -250, scale: 1.62 };
      tl.fromTo(PH, { x: REST.x, y: 1180, scale: REST.scale, transformOrigin: "0px 0px" },
        { x: REST.x, y: REST.y, duration: 0.85, ease: "expo.out" }, 0.12);
      tl.to(PH, { x: 470, duration: 0.7, ease: "power2.inOut" }, L(20.2));
      tl.to(PH, { ...PUNCH, duration: 0.7, ease: "power2.inOut" }, L(20.85));
      tl.to(PH, { x: 248, y: -412, scale: 2.0, duration: 0.55, ease: "power2.inOut" }, L(24.45));
      tl.to(PH, { ...PUNCH, y: -250, duration: 0.5, ease: "power2.inOut" }, L(25.3));
      tl.to(PH, { x: 240, y: 76, scale: 1.08, duration: 0.7, ease: "power2.inOut" }, L(26.2));

      // --- page states
      const show = (id, t, scroll, slide) => {
        tl.set("#ph-page .ph-st", { opacity: 0 }, t);
        tl.set("#ph-page", { y: -scroll }, t);
        if (slide) tl.fromTo(id, { opacity: 0, x: 36 }, { opacity: 1, x: 0, duration: 0.24, ease: "expo.out" }, t);
        else tl.set(id, { opacity: 1, x: 0 }, t);
        tl.set("#ph-sticky", { opacity: scroll >= 139 ? 1 : 0 }, t);
      };
      const tap = (x, y, t) => {
        tl.set("#ph-touch", { x: x, y: y }, t - 0.12);
        tl.fromTo("#ph-touch", { opacity: 0, scale: 1.35 }, { opacity: 1, scale: 1, duration: 0.1, ease: "power2.out" }, t - 0.12);
        tl.to("#ph-touch", { scale: 0.82, duration: 0.06, ease: "power2.in" }, t - 0.02);
        tl.to("#ph-touch", { scale: 1.1, opacity: 0, duration: 0.18, ease: "power2.out" }, t + 0.06);
      };
      show("#st-home", 0, 0, false);
      tap(125, 481, L(20.55));
      show("#st-s1a", L(20.72), 0, true);
      tl.to("#ph-page", { y: -330, duration: 0.42, ease: "power2.inOut" }, L(21.0));

      tl.set("#st-s1b", { opacity: 1 }, L(21.6));
