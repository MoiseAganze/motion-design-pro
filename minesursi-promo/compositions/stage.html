    (function () {
      const tl = gsap.timeline({ paused: true });
      const ft = (sel, from, to, at) => tl.fromTo(sel, from, Object.assign({ immediateRender: false }, to), at);

      // ---- camera: a framing puts screenshot point (sx, sy), in 576 px screenshot units, at canvas point (cx, cy) at scale s
      const K = 600 / 576;
      const F = (sx, sy, s, cx, cy) => {
        const lx = 15 + sx * K - 315;
        const ly = 15 + sy * K - 649.375;
        return { x: cx - 540 - s * lx, y: cy - 960 - s * ly, scale: s };
      };
      const FA = { x: 0, y: 209, scale: 1 }; // whole phone under the shelf
      const FLOW = { x: 0, y: 1709, scale: 1 };
      const FB = F(86, 208, 1.55, 300, 760); // shortcut "Communiqués"
      const FC1 = F(288, 400, 1.75, 540, 905); // first communiqués
      const FC2 = F(288, 520, 1.75, 540, 905);
      const FD = F(173, 1140, 1.5, 420, 1120); // nav "Actualités"
      const FE1 = F(288, 330, 1.55, 540, 860); // article photo
      const FE2 = F(288, 600, 1.55, 540, 860); // article headline
      const FF1 = F(234, 560, 1.9, 520, 900); // ESURSI TV video card
      const FG = F(518, 1140, 1.5, 700, 1120); // nav "Plus"
      const FH1 = F(288, 404, 1.75, 540, 820); // Offres & bourses
      const FH2 = F(288, 864, 1.75, 540, 820); // Centres de recherche
      const FI1 = F(300, 310, 1.85, 540, 760); // Vérifier un établissement
      const FI2 = F(300, 432, 1.85, 540, 820); // Mes documents

      const cam = (a, b, at, d, ease) => ft("#st-phone", a, { x: b.x, y: b.y, scale: b.scale, duration: d, ease: ease }, at);
      const camBlur = (at, d, px) => {
        ft("#st-phone", { filter: "blur(0px)" }, { filter: "blur(" + px + "px)", duration: d / 2, ease: "power2.in" }, at);
        ft("#st-phone", { filter: "blur(" + px + "px)" }, { filter: "blur(0px)", duration: d / 2, ease: "power2.out" }, at + d / 2);
      };

      gsap.set("#st-phone", FLOW);
      cam(FLOW, FA, 3.45, 0.9, "expo.out");
      cam(FA, FB, 5.45, 0.5, "power2.inOut");
      cam(FB, FC1, 6.12, 0.58, "expo.out");
      cam(FC1, FC2, 6.95, 0.6, "power2.inOut");
      cam(FC2, FD, 7.55, 0.42, "power3.inOut");
      camBlur(7.55, 0.42, 6);
      cam(FD, FE1, 8.12, 0.6, "expo.out");

      cam(FH1, FH2, 14.05, 0.5, "power2.inOut");
      cam(FH2, FA, 15.45, 0.55, "power2.inOut");
      cam(FA, FI1, 16.5, 0.58, "expo.out");
      cam(FI1, FI2, 19.15, 0.45, "power2.inOut");
      cam(FI2, FA, 20.9, 0.6, "power2.inOut");
      cam(FA, FEND, 22.5, 0.75, "power3.inOut");

      // ---- screens inside the phone
      gsap.set("#st-s-home", { x: 0, opacity: 1, scale: 1 });
      gsap.set("#st-s-comm", { x: 600, opacity: 1 });
      gsap.set(["#st-s-art", "#st-s-plus"], { opacity: 0, scale: 1 });
      gsap.set("#st-dim", { opacity: 0 });
      // Android push on release: Accueil -> Communiqués; the covered screen is then parked hidden
      ft("#st-s-comm", { x: 600 }, { x: 0, duration: 0.42, ease: "expo.out" }, 6.12);
      ft("#st-s-home", { x: 0 }, { x: -150, duration: 0.42, ease: "expo.out" }, 6.12);
      ft("#st-dim", { opacity: 0 }, { opacity: 0.5, duration: 0.42, ease: "power2.out" }, 6.12);
      tl.set("#st-s-home", { x: 0, opacity: 0 }, 6.6);
      tl.set("#st-dim", { opacity: 0 }, 6.6);
      // bottom-nav fade-through: outgoing 0.09 s, incoming 0.21 s from 94 %
      const fadeThrough = (outSel, inSel, at) => {
        ft(outSel, { opacity: 1 }, { opacity: 0, duration: 0.09, ease: "power1.in" }, at);
        ft(inSel, { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, duration: 0.21, ease: "power2.out" }, at + 0.09);
      };
      fadeThrough("#st-s-comm", "#st-s-art", 8.08); // tab Actualités
      fadeThrough("#st-s-art", "#st-s-home", 10.45); // tab Accueil

      // fling up the Plus list: from "Publications" back to "Mon espace"

      ft("#st-pl-strip", { filter: "blur(0px)" }, { filter: "blur(10px)", duration: 0.19, ease: "power2.in" }, 16.2);
      ft("#st-pl-strip", { filter: "blur(10px)" }, { filter: "blur(0px)", duration: 0.19, ease: "power2.out" }, 16.39);

      // ---- touches: disc lands, presses, lifts; the ripple answers on the same frame
      const touch = (disc, ripple, down) => {
        ft(disc, { opacity: 0, scale: 1.25 }, { opacity: 1, scale: 1, duration: 0.067, ease: "power2.out" }, down - 0.067);
        ft(disc, { scale: 1 }, { scale: 0.9, duration: 0.12, ease: "power1.out" }, down);
        ft(disc, { opacity: 1 }, { opacity: 0, duration: 0.2, ease: "power1.in" }, down + 0.12);
        const r = ripple + " i";
        tl.set(r, { opacity: 1 }, down);
        ft(r, { scale: 0 }, { scale: 1, duration: 0.32, ease: "power2.out" }, down);
        ft(r, { opacity: 1 }, { opacity: 0, duration: 0.25, ease: "power1.out" }, down + 0.2);

      touch("#st-tc1", "#st-rp1", 6.017);
      touch("#st-tc2", "#st-rp2", 8.057);
      touch("#st-tc3", "#st-rp3", 10.427);
      touch("#st-tc4", "#st-rp4", 12.437);
      touch("#st-tc5", "#st-rp5", 22.307);
      // the fling: finger lands, drags down, lifts where it ended
      ft("#st-swipe", { opacity: 0, scale: 1.25, y: 0 }, { opacity: 1, scale: 1, duration: 0.067, ease: "power2.out" }, 16.1);
      ft("#st-swipe", { y: 0 }, { y: 352, duration: 0.3, ease: "power2.inOut" }, 16.167);
      ft("#st-swipe", { opacity: 1 }, { opacity: 0, duration: 0.14, ease: "power1.in" }, 16.43);

      // ---- shelf and stripe: the stripe draws under the hook, rises to close the title shelf, then underlines the name
      gsap.set("#st-shelf", { y: -774 });
      gsap.set(["#st-seg-b", "#st-seg-y", "#st-seg-r"], { scaleX: 0 });
      ft("#st-seg-b", { scaleX: 0 }, { scaleX: 1, duration: 1.25, ease: "power1.inOut" }, 0.05);
      ft("#st-seg-y", { scaleX: 0 }, { scaleX: 1, duration: 0.25, ease: "expo.out" }, 1.5);
      ft("#st-seg-r", { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "expo.out" }, 2.42);
      ft("#st-shelf", { y: -774 }, { y: -1450, duration: 0.55, ease: "power3.inOut" }, 3.387);
      ft("#st-shelf", { y: -1450 }, { y: -1264, duration: 0.42, ease: "power3.inOut" }, 22.95);
      ft("#st-stripe", { scaleX: 1, transformOrigin: "50% 50%" }, { scaleX: 0.7037, transformOrigin: "50% 50%", duration: 0.42, ease: "power3.inOut" }, 22.95);

      // ---- colour floods (beats: 7 = 3.387, 13 = 6.290, 17 = 8.226, 22 = 10.645, 26 = 12.581, 34 = 16.452, 40 = 19.355)
      gsap.set("#st-g-light1", { y: 1920 });
      ft("#st-g-light1", { y: 1920 }, { y: 0, duration: 0.62, ease: "power3.inOut" }, 3.387);
      const iris = (sel, cx, cy, at) => {
        const c0 = "circle(0px at " + cx + "px " + cy + "px)";
        const c1 = "circle(2300px at " + cx + "px " + cy + "px)";
        gsap.set(sel, { clipPath: c0 });
        ft(sel, { clipPath: c0 }, { clipPath: c1, duration: 0.5, ease: "power2.inOut" }, at);
      };
      iris("#st-g-yellow1", 300, 760, 6.29); // from the tapped shortcut
      iris("#st-g-blue1", 420, 1120, 8.226); // from the tapped tab
      iris("#st-g-red1", 300, 1722, 10.645);
      iris("#st-g-light2", 700, 1120, 12.581);
      gsap.set("#st-g-blue2", { clipPath: "inset(0% 0% 100% 0%)" });
      ft("#st-g-blue2", { clipPath: "inset(0% 0% 100% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.45, ease: "power2.inOut" }, 16.452);
      gsap.set("#st-g-yellow2", { clipPath: "inset(0% 100% 0% 0%)" });
      ft("#st-g-yellow2", { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.45, ease: "power2.inOut" }, 19.355);
      iris("#st-g-navy", 300, 1722, 22.4);

      // ---- section titles in the shelf
      const words = (id) => "#" + id + " .w";
      const bar = (id) => "#" + id + " .st-bar";
      const blurWords = (sel, at) => {
        gsap.set(sel, { opacity: 0 });
        ft(sel, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, ease: "power2.out", stagger: 0.067 }, at);
      };
      const inkWords = (sel, at) => {
        gsap.set(sel, { opacity: 0 });
        ft(sel, { opacity: 0, color: "#5f7fb8" }, { opacity: 1, duration: 0.08, ease: "none", stagger: 0.09 }, at);
        ft(sel, { color: "#5f7fb8" }, { color: "#ffffff", duration: 0.18, ease: "power1.out", stagger: 0.09 }, at + 0.08);
      };
      const barIn = (id, at) => {
        gsap.set(bar(id), { scaleY: 0 });
        ft(bar(id), { scaleY: 0 }, { scaleY: 1, duration: 0.3, ease: "expo.out" }, at);
      };
      const titleOut = (id, at) => {
        ft(words(id), { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(8px)", duration: 0.15, ease: "power2.in", stagger: 0.03 }, at);
        ft(bar(id), { scaleY: 1 }, { scaleY: 0, duration: 0.15, ease: "power2.in" }, at);
      };

      barIn("st-t2", 3.95);
      blurWords("#st-t2 .st-l:nth-child(2) .w", 3.95);
      blurWords("#st-t2 .st-l:nth-child(3) .w", 4.85);
      titleOut("st-t2", 6.05);

      barIn("st-t3", 6.3);
      inkWords(words("st-t3"), 6.3);
      titleOut("st-t3", 7.85);

      barIn("st-t4", 8.3);
      blurWords(words("st-t4"), 8.3);
      titleOut("st-t4", 10.25);

      barIn("st-t5", 10.7);
      gsap.set(words("st-t5"), { opacity: 0 });
      ft(words("st-t5"), { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power3.out" }, 10.7);
      titleOut("st-t5", 12.15);

      barIn("st-t6", 12.85);
      inkWords(words("st-t6"), 12.85);
      titleOut("st-t6", 14.15);

      barIn("st-t7", 14.3);
      blurWords(words("st-t7"), 14.3);
      titleOut("st-t7", 15.8);

      barIn("st-t8", 16.5);
      gsap.set(words("st-t8"), { opacity: 0 });
      ft(words("st-t8"), { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power3.out" }, 16.5);
      titleOut("st-t8", 19.2);

      barIn("st-t9", 19.45);
      blurWords("#st-t9 .st-l:nth-child(2) .w", 19.45);
      blurWords("#st-t9 .st-l:nth-child(3) .w", 21.1);
      titleOut("st-t9", 22.2);

      window.__timelines["stage"] = tl;
    })();
  </script>
